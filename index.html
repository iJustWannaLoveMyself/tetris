<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Tetris</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="game-wrapper">
      <div class="game-container">
        <div class="score-board">
          <div>СЧЁТ: <span id="score">0</span></div>
          <div>РЕКОРД: <span id="high-score">0</span></div>
        </div>
        <div class="grid"></div>
      </div>
      <div class="sidebar">
        <div class="player">
          <label for="player-name">ИГРОК</label>
          <input
            id="player-name"
            type="text"
            maxlength="10"
            autocomplete="off"
            placeholder="Имя"
          />
        </div>
        <h3>ДАЛЕЕ</h3>
        <div class="next-queue"></div>
      </div>
    </div>
    <script src="src/script.ts" type="module"></script>
  </body>
</html>
